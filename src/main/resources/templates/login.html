<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Software Development Document Environment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', sans-serif; }
        .login-card { max-width: 420px; margin: 100px auto; padding: 30px; border-radius: 12px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .brand-header { font-weight: 700; color: #1e293b; text-align: center; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="brand-header">SDM Environment</h3>
        <p class="text-center text-muted mb-4">Sign in to Software Development Document Environment</p>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-info" role="alert">
            You have been logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label font-weight-bold">Username</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="admin / maker / checker">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label font-weight-bold">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="admin123">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 font-weight-bold">Sign In</button>
        </form>

        <div class="mt-4 pt-3 border-top text-center text-muted small">
            Default Demo Credentials:<br>
            <strong>admin</strong> / admin123 | <strong>maker</strong> / admin123 | <strong>checker</strong> / admin123
        </div>
    </div>
</body>
</html>
