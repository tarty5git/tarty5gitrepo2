<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checker Dashboard - Software Development Document Environment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container-fluid px-4 py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold"><i class="bi bi-shield-check me-2"></i>Maker / Checker Document Review Dashboard</h4>
            <a href="/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Workbench</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark fw-bold">Pending & Submitted Document Approvals</div>
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Doc ID</th>
                            <th>Phase</th>
                            <th>Deliverable</th>
                            <th>Filename</th>
                            <th>Version</th>
                            <th>Submitted By</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="doc : ${documents}">
                            <td class="fw-bold" th:text="${doc.docId}">P101</td>
                            <td th:text="'Phase ' + ${doc.phaseNum}">Phase 1</td>
                            <td th:text="${doc.deliverableCode}">PC-01</td>
                            <td th:text="${doc.originalFilename}">file.docx</td>
                            <td th:text="${doc.docVersion}">1.0</td>
                            <td th:text="${doc.uploadedBy}">maker</td>
                            <td>
                                <span class="badge" th:classappend="${doc.status == 'APPROVED' ? 'bg-success' : (doc.status == 'REJECTED' ? 'bg-danger' : 'bg-warning text-dark')}" th:text="${doc.status}">PENDING</span>
                            </td>
                            <td>
                                <a th:href="@{/api/documents/{docId}/download(docId=${doc.docId})}" class="btn btn-sm btn-outline-info me-1" title="View/Download Document">
                                    <i class="bi bi-eye"></i> View File
                                </a>
                                <div class="d-inline" th:if="${doc.status == 'PENDING_APPROVAL'}">
                                    <form action="/checker/action" method="post" class="d-inline me-1">
                                        <input type="hidden" name="docId" th:value="${doc.docId}">
                                        <input type="hidden" name="action" value="APPROVE">
                                        <button type="submit" class="btn btn-sm btn-success"><i class="bi bi-check-circle"></i> Approve</button>
                                    </form>
                                    <form action="/checker/action" method="post" class="d-inline">
                                        <input type="hidden" name="docId" th:value="${doc.docId}">
                                        <input type="hidden" name="action" value="REJECT">
                                        <input type="hidden" name="reason" value="Requires clarification">
                                        <button type="submit" class="btn btn-sm btn-danger"><i class="bi bi-x-circle"></i> Reject</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${documents.isEmpty()}">
                            <td colspan="8" class="text-center py-4 text-muted">No documents submitted yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
