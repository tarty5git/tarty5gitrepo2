server.port=8080

app.name=Software Development Document Environment
app.code=SDM

spring.datasource.url=jdbc:h2:mem:sdmdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.auth.ldap.enabled=false
app.auth.ldap.url=ldap://localhost:389/dc=cth,dc=com
app.auth.ldap.user-dn-pattern=uid={0},ou=people

app.notification.email.enabled=false
app.notification.sms.enabled=false

app.intake.folder.path=./intake_folder
app.intake.handlers.count=2
app.intake.poll-interval-ms=3000

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploaded_documents

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.rag.service-url=http://localhost:5000
